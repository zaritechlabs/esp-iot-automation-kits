name: Zaritech Firmware Verification

on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP8266 Core Board
        run: |
          # Kararlı çalışan GitHub tabanlı resmî ek döküman URL'si eklendi
          arduino-cli core update-index --additional-urls https://github.com
          arduino-cli core install esp8266:esp8266 --additional-urls https://github.com

      - name: Compile All Zaritech Firmware Files
        run: |
          for file in $(find kits/ -name "*.ino"); do
            echo "--------------------------------------------------"
            echo "[ZARITECH CI] Compiling firmware: $file"
            echo "--------------------------------------------------"
            arduino-cli compile --fqbn esp8266:esp8266 "$file"
          done
